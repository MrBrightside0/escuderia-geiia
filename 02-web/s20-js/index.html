<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El gato · Escudería GEIIA</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- El título lleva clase para poder darle estilo aparte -->
    <h1 class="titulo">El gato</h1>

    <!-- id porque es UNO solo. JavaScript lo busca con #turno -->
    <div id="turno">Turno de X</div>

    <!-- El contenedor lleva el grid. Las nueve casillas lo obedecen -->
    <div class="tablero">
        <div class="casilla"></div>
        <div class="casilla"></div>
        <div class="casilla"></div>
        <div class="casilla"></div>
        <div class="casilla"></div>
        <div class="casilla"></div>
        <div class="casilla"></div>
        <div class="casilla"></div>
        <div class="casilla"></div>
    </div>

    <button class="reiniciar">Reiniciar</button>

    <!-- El script va AL FINAL del body.
         Si va arriba, JavaScript busca las casillas antes de que
         existan y agarra null. Es el error número uno del DOM. -->
    <script src="juego.js"></script>
    <script src="practica.js"></script>

</body>
</html>
